<script>
    let roomSpecificDialogueCount = 0;

    function roomSpecificDialogue(){

        if (roomSpecificDialogueCount == 0){
        dialogueUpdate([
        new DialougeLine ("cc", '0o', "Oh, a record of everyone who's been here before!!!")
        ,new DialougeLine (0, '0o', "(or, anyone who cared to put their name down I suppose)")
        ,new DialougeLine (0, '--', "What does that say???")
        ,new DialougeLine (0, '**', '\"jonkler fat feet stinking up the room\"')
        ,new DialougeLine (0, '--', "I don't think I want to be here anymore...")
        ], ['roomvisit', 'guestbook'])
        }else{
            dialogueUpdate([
            new DialougeLine (0, '--', "I don't want to be here anymore...")
        ])
        }

        roomSpecificDialogueCount += 1;
    }

</script>
