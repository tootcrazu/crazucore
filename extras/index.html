<script>
    let roomSpecificDialogueCount = 0;
  
    let roomSpecificDialogue1 = [
        new DialougeLine ("cc", '0o', "My room was stuffed in a drawer this whole time???")
        ,new DialougeLine (0, ['>:','('], "That's rude!!! I'm like the most interesting thing on this whole site!!!")
        ,new DialougeLine (0, ['>:','('], "And what's with that footer line? It's boring!!!")
        ,new DialougeLine (0, '**', 'It should say:')
        ,new DialougeLine (0, '^^', '"This is the second best room in the site, because it has the door to CCs room in it."')
        ,new DialougeLine (0, '0o', 'At least the door has the common decency to have the same colors as my face.')
        ]

    let roomSpecificDialogue2 = [
            new DialougeLine (0, '0o', "Not sure what a 'Breaking Bad' is, though...")
        ]

    if (getCookie('ccr_cc_roomtheme') != undefined){
        document.getElementById('ext-ccdoor').classList.remove('_hide');
    }

    if (getCookie('all_vs_roomsvisited').split(',').includes('extras')){
        document.getElementById('footer-marq').innerHTML = "This is the second best room in the site, because it has the door to CCs room in it.";

        roomSpecificDialogue1 = [
        new DialougeLine ("cc", '>o', "Clearly, someone's looking out for me!")
        ,new DialougeLine (0, '^^', "That's what the footer should've said the whole time!!!")
        ]
    };
    // update these lines if the requisite conditions have been met.
    if (getCookie('all_vs_roomsvisited').split(',').includes('breakingbad')){

        roomSpecificDialogue2 = [
            new DialougeLine (0, '0o', "If the one on the right is the sad middle-aged man, does that make the one on the left the pink man???")
        ]
    };

    function roomSpecificDialogue(){

        if (roomSpecificDialogueCount == 0){
        dialogueUpdate(roomSpecificDialogue1, ['roomvisit', 'extras'])
        }else{
            dialogueUpdate(roomSpecificDialogue2)
        }

        roomSpecificDialogueCount += 1;
    }

</script>
