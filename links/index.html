<script src="../scripts/cookiehandler.js"></script>

<script src="../scripts/dialougehandler.js"></script>
<script>
    const dialougeBoxL = document.getElementById("links-dialouge");
    const vendorImage = document.getElementById("links-vendor");
    const goThereButton = document.getElementById("links-gothere");
    const goThereLink = document.getElementById("links-gotherelink");
    const blinkieCopyCode = "<a href='https://crazu.co.nz'><img src='https://www.crazu.co.nz/assets/links/crazublinkie.gif' alt='visit crazucore... if you want...'></a>"
    let indexTrackerL = 0;
    let currentLineL = "";
    const textspeedL = 15;

    const updateCat = document.getElementById("links-catonecameo");
    const updateCatShowHide = updateCat.animate([{transform:"translateY(0px)"}, {transform:"translateY(-175px)"}], {duration: 8000, fill:"forwards"});

    updateCatShowHide.reverse();
    updateCatShowHide.finish();
    
    
    function dialougeUpdate(newLine){

        if (indexTrackerL == 0){
            dialougeBoxL.innerHTML = ("");
            currentLineL = newLine;
            textaddL();
        }
    }

    function textaddL(){
        setTimeout(addNewCharL, textspeedL);
        function addNewCharL(){
            vendorImage.setAttribute('src', '../assets/links/crazulink-talking.png')
            dialougeBoxL.innerHTML += currentLineL[indexTrackerL];
            indexTrackerL += 1;
            if (indexTrackerL < currentLineL.length){
                setTimeout(addNewCharL, textspeedL);
            }
            else {
                vendorImage.setAttribute('src', '../assets/links/crazulink-neutral.png')
                indexTrackerL = 0;
            }
        }
    }

    function goThereUpdate(link){
        if (link == 0){
            if (goThereButton.classList.length != 0){
            goThereButton.classList.remove("links-gothereactive");
            }
        }
        else{
            goThereButton.classList.add("links-gothereactive");
            goThereLink.setAttribute('href', link);
        }
    }


    if (getCookie("all_cc_location") == 'footer'){
        dialougeUpdate("oh, hello down there..");
        }else{
        dialougeUpdate("hey.. there isn't much here, but you can take a look around if you want.");
    }

    // And so ends the links dialogue, crying rivers with it's tears
    // this code is really stupid, because I misspelled the word 'dialogue' when I wrote it
    // so now when the original links call for a dialogue update it calls 'dialougeUpdate() and my new cool dialogue ststem calls dialougeUpdate())'

    function littleQdialogue(){

        if (getCookie('all_cc_location') == 'footer'){
            dialogueUpdate([
            new DialougeLine ("cc", '0o', "Hi Little Q!")
            ,new DialougeLine ('lq', 0, "�� �� ��� ��������� �� ���� ����")
            ,new DialougeLine ("cc", '**', "Oh!")
            ,new DialougeLine ('ob', 0, "yeah i can't understand what it says either.")
            ,new DialougeLine ("cc", '0o', "I see. How do you know it's name then?")
            ,new DialougeLine ('ob', 0, "oh it can still point to stuff. that's how i found out that it likes eating guacamole.")
            ,new DialougeLine ('lq', 0, "� ������� ���� ��������� �� ����")
            ,new DialougeLine ('cc', '0o', "Huh...")
            ,new DialougeLine ('ob', 0, "it's great at games too. you should see it play one of those rhythm games where you hit the drums.")
            ,new DialougeLine ('ob', 0, "unstoppable.")
            ], ['cookieupdate', ['all_cc_metlittleq', 'true']])
        }
    }

    function obHandler(){
        // handles OB's interactions now that he can say multiple different things

        if (getCookie('all_cc_location') == 'footer'){

            if (getCookie('all_vs_roomsvisited').split(',').includes('links') != true){
                dialogueUpdate([
                new DialougeLine ("cc", '0o', "Hi there!")
                ,new DialougeLine ('ob', 0, "uh... hi?")
                ,new DialougeLine ('cc', '0o', "I'm CC. I'm kind of new, but " + getCookie('all_vs_name') + " is showing me around!")
                ,new DialougeLine ('ob', 0, "fascinating. (i didn't know the people who visited this site had names...)")
                ,new DialougeLine ('ob', 0, "you came from another page on the site?")
                ,new DialougeLine ('cc', '0o', "Yeah, but it was super boring. So I'm getting taken around to see the sights. Want to come?")
                ,new DialougeLine ('ob', 0, "me? nah. i prefer it here.")
                ,new DialougeLine ('ob', 0, "it's comfortable.")
                ,new DialougeLine ("cc", '0o', "Ok... Is it just you here? Can't say I've met too many other people around.")
                ,new DialougeLine ('ob', 0, "me, and little q.")
                ,new DialougeLine ("cc", '0o', "Little Q?")
                ,new DialougeLine ('ob', 0, "yeah, my buddy. shake the food bowl over there a little bit, it'll probably come out and say hi to ya.")
                ], ['roomvisit', 'links'])
            }else if(getCookie('all_vs_roomsvisited').split(',').includes('about')){
                dialogueUpdate([
                new DialougeLine ("cc", '0o', "You know, I noticed something on the 'about' page.")
                ,new DialougeLine ('ob', 0, "?")
                ,new DialougeLine ('cc', '0o', "There's ID cards there. One for you, and one for Little Q.")
                ,new DialougeLine ('ob', 0, "really?")
                ,new DialougeLine ('cc', '0o', "Yeah, with photos and everything.")
                ,new DialougeLine ('cc', '0o', "Signatures, too.")
                ,new DialougeLine ('ob', 0, "did they have anything else on them?")
                ,new DialougeLine ("cc", '0o', "Not really. Neither of them had a surname or an age listed, and the sex on both was listed as 'undefined'.")
                ,new DialougeLine ('ob', 0, "heh, yeah that sounds about right.")
                ,new DialougeLine ("cc", '0o', "There was a third card there too, though. A weird one.")
                ,new DialougeLine ("cc", '0o', "I haven't quite figured out who it belongs to yet, though.")
                ,new DialougeLine ('ob', 0, "let me know if you figure it out, i guess.")
                ])
            }else{
                dialogueUpdate([
                new DialougeLine ("cc", '0o', "So you and Little Q just hang out here all the time?")
                ,new DialougeLine ('ob', 0, "that's about the size of it, yeah.")
                ,new DialougeLine ('cc', '0o', "You don't get bored at all?")
                ,new DialougeLine ('ob', 0, "oh we play like, games and stuff. when there's no one around.")
                ,new DialougeLine ('ob', 0, "(never try to beat little q at mario party. seriously, you'd think it's all luck but we've played hundreds of times and it's literally never lost once.)")
                ])
            }


        }else{
            dialougeUpdate('this body? pretty crude, right? you\'d think it was drawn in paint. as far as having any form at all goes, i suppose it\'s not so bad. at least i have a little bit of shading. (does having a black inner glow filter count as shading?)')
        }

    }

    function roomSpecificDialogue(){

        if (getCookie('all_vs_roomsvisited').split(',').includes('links') != true){
            dialogueUpdate([
            new DialougeLine ("cc", 'cc', "psst, " + getCookie('all_vs_name') + '!!!')
            ,new DialougeLine (0, 'oo', "There's someone else here!")
            ,new DialougeLine (0, '0o', "Think we can say hi?")
            ])
        }else{
            dialogueUpdate([
            new DialougeLine ("cc", '0o', "There's certainly a lot of stuff here.")
            ,new DialougeLine ('ob', 0, "and all of it is important for something.")
            ,new DialougeLine ('ob', 0, "which is why they had to get someone to watch over it.")
            ,new DialougeLine ("cc", '0o', "I see. So what's that potion for?")
            ,new DialougeLine ('ob', 0, "not a clue.")
            ,new DialougeLine ("cc", 'cc', "...")
            ])
        }





    }

</script>
