<script>
    const dialougeBoxL = document.getElementById("links-dialouge");
    const vendorImage = document.getElementById("links-vendor");
    const goThereButton = document.getElementById("links-gothere");
    const goThereLink = document.getElementById("links-gotherelink");
    const blinkieCopyCode = "<a href='https://crazu.co.nz'><img src='https://www.crazu.co.nz/assets/links/crazublinkie.gif' alt='visit crazucore... if you want...'></a>"
    let indexTrackerL = 0;
    let currentLine = "";
    const textspeedL = 15;

    const updateCat = document.getElementById("links-catonecameo");
    const updateCatShowHide = updateCat.animate([{transform:"translateY(0px)"}, {transform:"translateY(-175px)"}], {duration: 8000, fill:"forwards"});

    updateCatShowHide.reverse();
    updateCatShowHide.finish();
    
    
    function dialougeUpdate(newLine){

        if (indexTrackerL == 0){
            dialougeBoxL.innerHTML = ("");
            currentLine = newLine;
            textaddL();
        }
    }

    function textaddL(){
        setTimeout(addNewCharL, textspeedL);
        function addNewCharL(){
            vendorImage.setAttribute('src', '../assets/links/crazulink-talking.png')
            dialougeBoxL.innerHTML += currentLine[indexTrackerL];
            indexTrackerL += 1;
            if (indexTrackerL < currentLine.length){
                setTimeout(addNewCharL, textspeedL);
            }
            else {
                vendorImage.setAttribute('src', '../assets/links/crazulink-neutral.png')
                indexTrackerL = 0;
            }
        }
    }

    function goThereUpdate(link){
        if (link == 0){
            if (goThereButton.classList.length != 0){
            goThereButton.classList.remove("links-gothereactive");
            }
        }
        else{
            goThereButton.classList.add("links-gothereactive");
            goThereLink.setAttribute('href', link);
        }
    }



    dialougeUpdate("hey.. there isn't much here, but you can take a look around if you want.");

</script>
<script src="../scripts/footerscript.js"></script>
